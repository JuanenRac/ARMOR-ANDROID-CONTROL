# =============================================================================
# ARMOR-ANDROID-CONTROL - the pictures of the app for the README, taken in an emulator
# Copyright (C) 2026 JuanenRac (Electro Hobby 3D)
# GPL-3.0-or-later - see LICENSE
# =============================================================================
# Takes the pictures of the app (app/src/androidTest ScreenshotsTest) in an Android emulator (API 34) of a GitHub runner against a REAL ARMOR-SERVER started on the runner, never on a
# phone. It starts by hand (workflow_dispatch) or on a branch named screenshots-run/<anything>, so it never runs on main or on a pull request. The pictures are the artifact
# "android-screenshots"; reduce them to a palette of 128 colours (under 400 KiB) before they go to images/screenshots.

name: Android screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - "screenshots-run/**"

permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Screenshots in an API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is started with the tools the runner already has (no third-party action): the system image is fetched, a virtual phone is made, it boots without a window,
      # and Gradle runs the instrumented tests on it.
      - name: Start an API 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" >/dev/null
          echo no | avdmanager create avd --force --name armor-api34 --package "system-images;android-34;google_apis;x86_64" --device pixel_6
          nohup emulator -avd armor-api34 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >emulator.log 2>&1 &
          sleep 20
          pgrep -f 'qemu-system|emulator' >/dev/null || { echo "the emulator process is not running"; cat emulator.log; exit 1; }
          timeout 300 adb wait-for-device || { echo "no device appeared"; tail -n 60 emulator.log; exit 1; }
          for _ in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "the emulator did not finish booting"; tail -n 40 emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      # The real server: the emulator reaches the host on 10.0.2.2, so the server listens on the loopback of the runner with an administrator of its own and an empty data folder.
      - name: Check out the server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/ARMOR-SERVER
          path: server
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build and start the server
        working-directory: server
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/armor-data"
          ARMOR_HOST=127.0.0.1 ARMOR_PORT=18080 ARMOR_DATA_DIR="$RUNNER_TEMP/armor-data"           ARMOR_INGEST_TOKEN="$(printf 'i%.0s' $(seq 1 32))" ARMOR_CONTROL_TOKEN="$(printf 'c%.0s' $(seq 1 32))" ARMOR_OPERATOR_TOKEN="$(printf 'o%.0s' $(seq 1 32))"           ARMOR_CAMERA_CONFIG_KEY="$(printf 'k%.0s' $(seq 1 40))" ARMOR_STUDIO_USERNAME=admin ARMOR_STUDIO_PASSWORD=correct-horse-battery           nohup node dist/server.mjs >"$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Run the instrumented tests
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.armorServer=http://10.0.2.2:18080 -Pandroid.testInstrumentationRunnerArguments.class=es.electrohobby3d.armor.ScreenshotsTest

      - name: Pull the pictures
        if: ${{ always() }}
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="$SDK/platform-tools:$PATH"
          mkdir -p "$RUNNER_TEMP/shots"
          adb pull /data/local/tmp/shots/. "$RUNNER_TEMP/shots/" || true
          ls -la "$RUNNER_TEMP/shots"
          adb logcat -d -s TestRunner:* AndroidJUnitRunner:* System.err:* AndroidRuntime:* > "$RUNNER_TEMP/shots/logcat.txt" || true
          cp -r app/build/outputs/androidTest-results "$RUNNER_TEMP/shots/results" 2>/dev/null || true

      - name: Keep the pictures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: warn
